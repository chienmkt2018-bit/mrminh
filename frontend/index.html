<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học học nữa học mãi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js cho Dashboard Admin -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Thư viện đọc file Excel (SheetJS) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 shadow-sm p-4 flex justify-between items-center">
        <h1 class="font-bold text-xl text-blue-600 flex items-center gap-2">
            <i class="fa-solid fa-graduation-cap"></i> Học học nữa học mãi
        </h1>
        <div id="user-info" class="text-sm font-medium"></div>
    </header>

    <!-- Main Content Container (SPA Dynamic View) -->
    <main class="flex-grow max-w-7xl mx-auto p-6 w-full">
        <div id="app-view">
            <!-- Nội dung sẽ được render tự động thông qua app.js -->
            <div class="text-center py-12 text-gray-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                <p>Đang tải ứng dụng...</p>
            </div>
        </div>
    </main>

    <!-- Nhập JavaScript theo chuẩn ES Modules -->
    <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
