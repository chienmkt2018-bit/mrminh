<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7fb">
    <title>Học học nữa học mãi</title>
    <script>tailwind = { config: { darkMode: 'class' } };</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="./assets/css/custom.css">
    <link rel="stylesheet" href="./assets/css/learnify-admin.css">
    <script>
      try {
        const theme = localStorage.getItem('edusystem-theme');
        const preferredDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', theme ? theme === 'dark' : preferredDark);
      } catch (error) {}
    </script>
</head>
<body class="min-h-screen flex flex-col">
    <header class="site-header">
        <a href="/" class="brand">
            <span class="brand-mark"><i class="fa-solid fa-graduation-cap"></i></span>
            <span class="brand-copy">
                <span class="brand-title">Học học nữa học mãi</span>
                <span class="brand-subtitle">Nền tảng học tập và kiểm tra trực tuyến</span>
            </span>
        </a>
        <div class="header-actions">
            <span class="header-status"><span class="status-dot"></span>Không gian học tập</span>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Chuyển giao diện sáng tối" title="Chuyển giao diện sáng tối">
                <i id="theme-toggle-icon" class="fa-solid fa-moon"></i><span class="theme-toggle-label">Giao diện</span>
            </button>
            <div id="user-info" class="text-sm font-medium"></div>
        </div>
    </header>
    <main class="site-main flex-grow max-w-7xl mx-auto w-full">
        <div id="app-view">
            <div class="loading-state">
                <span class="loading-icon"><i class="fa-solid fa-spinner fa-spin"></i></span>
                <p class="loading-title">Đang tải ứng dụng</p>
                <p class="loading-subtitle">Vui lòng chờ trong giây lát...</p>
            </div>
        </div>
    </main>
    <footer class="site-footer">
        <span>© <span id="current-year"></span> Học học nữa học mãi</span>
        <span>Học tập mỗi ngày, tiến bộ từng bước.</span>
    </footer>
    <script type="module" src="./assets/js/theme.js"></script>
    <script type="module" src="./assets/js/app.js?v=20261018-admin-login-fix-4"></script>
    <script src="./assets/js/learnify-admin.js?v=20261018-admin-login-fix-3"></script>
    <script>
      // Startup watchdog: show a visible recovery panel for script errors,
      // rejected promises, missing app initialization, or an empty app root.
      (() => {
        let appStarted = false;
        let lastProblem = 'Ứng dụng chưa hoàn tất khởi tạo.';
        const appView = () => document.getElementById('app-view');
        const hasAppContent = () => {
          const root = appView();
          return !!root && !!root.children.length && !root.querySelector('.loading-state');
        };

        function showStartupError(detail) {
          const root = appView();
          if (!root || hasAppContent()) return;
          root.innerHTML = `
            <section style="max-width:680px;margin:32px auto;padding:24px;border:1px solid #fca5a5;border-radius:16px;background:#fff;color:#111827;font-family:system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.08)">
              <h2 style="font-size:20px;font-weight:700;color:#b91c1c">Ứng dụng chưa khởi động được</h2>
              <p style="margin-top:8px;line-height:1.6">Đã phát hiện trang chưa hiển thị giao diện. Bạn có thể thử tải lại hoặc xóa phiên đăng nhập lưu trên trình duyệt.</p>
              <pre id="startup-error-detail" style="white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px;padding:12px;background:#f3f4f6;border-radius:8px;font-size:12px"></pre>
              <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:16px">
                <button id="startup-retry" type="button" style="padding:10px 16px;border-radius:8px;background:#2563eb;color:white;font-weight:600;cursor:pointer">Tải lại trang</button>
                <button id="startup-reset" type="button" style="padding:10px 16px;border-radius:8px;background:#fff;border:1px solid #d1d5db;color:#111827;font-weight:600;cursor:pointer">Xóa phiên đăng nhập</button>
              </div>
            </section>`;
          const pre = document.getElementById('startup-error-detail');
          if (pre) pre.textContent = detail || lastProblem;
          document.getElementById('startup-retry')?.addEventListener('click', () => location.reload());
          document.getElementById('startup-reset')?.addEventListener('click', () => {
            try {
              localStorage.removeItem('currentUser');
              localStorage.removeItem('token');
            } catch (error) {
              console.warn('Không thể xóa phiên đăng nhập:', error);
            }
            location.reload();
          });
        }

        window.addEventListener('error', (event) => {
          if (event.target && event.target.tagName === 'SCRIPT') {
            lastProblem = 'Không tải được tệp JavaScript: ' + (event.target.src || '(script nội bộ)');
          } else {
            lastProblem = 'Lỗi JavaScript: ' + (event.message || 'Không rõ chi tiết') +
              (event.filename ? '\\nTệp: ' + event.filename : '') +
              (event.lineno ? '\\nDòng: ' + event.lineno : '');
          }
          console.error(lastProblem, event.error || '');
          showStartupError(lastProblem);
        }, true);

        window.addEventListener('unhandledrejection', (event) => {
          lastProblem = 'Lỗi Promise: ' + String(event.reason?.stack || event.reason || 'Không rõ chi tiết');
          console.error(lastProblem);
          showStartupError(lastProblem);
        });

        document.addEventListener('app:started', () => { appStarted = true; });

        window.setTimeout(() => {
          const root = appView();
          if (!root) {
            lastProblem = 'Không tìm thấy phần tử #app-view trong HTML.';
            showStartupError(lastProblem);
            return;
          }
          if (!appStarted && !hasAppContent()) {
            lastProblem = 'Quá thời gian chờ 8 giây. app.js chưa dựng giao diện hoặc đã để vùng ứng dụng trống. Kiểm tra tải tệp JavaScript và lỗi khởi tạo.';
            showStartupError(lastProblem);
          }
        }, 8000);
      })();
    </script>
</body>
</html>
