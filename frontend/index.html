<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7fb">
    <title>Học học nữa học mãi</title>
    <script>tailwind = { config: { darkMode: 'class' } };</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="./assets/css/custom.css">
    <link rel="stylesheet" href="./assets/css/learnify-admin.css">
    <script>
      try {
        const theme = localStorage.getItem('edusystem-theme');
        const preferredDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', theme ? theme === 'dark' : preferredDark);
      } catch (error) {}
    </script>
</head>
<body class="min-h-screen flex flex-col">
    <header class="site-header">
        <a href="/" class="brand">
            <span class="brand-mark"><i class="fa-solid fa-graduation-cap"></i></span>
            <span class="brand-copy">
                <span class="brand-title">Học học nữa học mãi</span>
                <span class="brand-subtitle">Nền tảng học tập và kiểm tra trực tuyến</span>
            </span>
        </a>
        <div class="header-actions">
            <span class="header-status"><span class="status-dot"></span>Không gian học tập</span>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Chuyển giao diện sáng tối" title="Chuyển giao diện sáng tối">
                <i id="theme-toggle-icon" class="fa-solid fa-moon"></i><span class="theme-toggle-label">Giao diện</span>
            </button>
            <div id="user-info" class="text-sm font-medium"></div>
        </div>
    </header>
    <main class="site-main flex-grow max-w-7xl mx-auto w-full">
        <div id="app-view">
            <div class="loading-state">
                <span class="loading-icon"><i class="fa-solid fa-spinner fa-spin"></i></span>
                <p class="loading-title">Đang tải ứng dụng</p>
                <p class="loading-subtitle">Vui lòng chờ trong giây lát...</p>
            </div>
        </div>
    </main>
    <footer class="site-footer">
        <span>© <span id="current-year"></span> Học học nữa học mãi</span>
        <span>Học tập mỗi ngày, tiến bộ từng bước.</span>
    </footer>
    <script type="module" src="./assets/js/theme.js"></script>
    <script type="module" src="./assets/js/app.js"></script>
    <script src="./assets/js/learnify-admin.js"></script>
    <script>
      // Fallback diagnostics: prevent an endless loading spinner if the app module
      // fails to load or initialize. Keep this independent of app.js.
      (() => {
        let appScriptFailed = false;
        window.addEventListener('error', (event) => {
          const target = event.target;
          if (target && target.tagName === 'SCRIPT' &&
              /assets\/js\/(app|theme)\.js/.test(target.src || '')) {
            appScriptFailed = true;
            showStartupError('Không tải được tệp JavaScript: ' + target.src);
          } else if (event.message) {
            console.error('Lỗi JavaScript:', event.message, event.filename, event.lineno);
          }
        }, true);

        window.addEventListener('unhandledrejection', (event) => {
          console.error('Lỗi Promise chưa được xử lý:', event.reason);
        });

        function showStartupError(detail) {
          const appView = document.getElementById('app-view');
          if (!appView || !appView.querySelector('.loading-state')) return;
          appView.innerHTML = `
            <section style="max-width:640px;margin:48px auto;padding:24px;border:1px solid #fca5a5;border-radius:16px;background:#fff;color:#111827;font-family:system-ui,sans-serif">
              <h2 style="font-size:20px;font-weight:700;color:#b91c1c">Ứng dụng chưa khởi động được</h2>
              <p style="margin-top:8px">Trang đã tải nhưng JavaScript chưa khởi tạo giao diện. Hãy tải lại trang; nếu lỗi tiếp tục, gửi thông tin bên dưới cho người hỗ trợ.</p>
              <pre style="white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px;padding:12px;background:#f3f4f6;border-radius:8px;font-size:12px"></pre>
              <button id="startup-retry" type="button" style="margin-top:16px;padding:10px 16px;border-radius:8px;background:#2563eb;color:white;font-weight:600">Tải lại trang</button>
            </section>`;
          const pre = appView.querySelector('pre');
          if (pre) pre.textContent = detail || (appScriptFailed ? 'Tệp JavaScript không tải được.' : 'Quá thời gian chờ khởi tạo (8 giây). Kiểm tra Console và tab Mạng.');
          document.getElementById('startup-retry')?.addEventListener('click', () => location.reload());
        }

        window.setTimeout(() => {
          const appView = document.getElementById('app-view');
          if (appView && appView.querySelector('.loading-state')) {
            showStartupError('Quá thời gian chờ khởi tạo (8 giây). JavaScript có thể bị lỗi khi tải hoặc thực thi. Mở DevTools > Console/Mạng để xem chi tiết.');
          }
        }, 8000);
      })();
    </script>
</body>
</html>
