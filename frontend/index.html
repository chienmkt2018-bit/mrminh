<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Học Tập Chuyên Nghiệp v6</title>
    <!-- Tailwind CSS CDN / Build -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js cho Dashboard Admin -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col">

    <header class="bg-white dark:bg-gray-800 shadow-sm p-4 flex justify-between items-center">
        <h1 class="font-bold text-xl text-blue-600"><i class="fa-solid fa-graduation-cap"></i> EduSystem v6</h1>
        <div id="user-info" class="text-sm font-medium"></div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto p-6 w-full">
        <div id="app-view">
            <!-- Dynamic SPA Content -->
            <div class="max-w-md mx-auto bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg mt-10">
                <h2 class="text-2xl font-bold mb-4 text-center">Đăng Nhập Hệ Thống</h2>
                <form id="login-form" class="space-y-4">
                    <input type="text" id="username" placeholder="Tên đăng nhập" required class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                    <input type="password" id="password" placeholder="Mật khẩu" required class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition">Đăng Nhập</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Nhập JavaScript theo chuẩn ES Modules -->
    <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
